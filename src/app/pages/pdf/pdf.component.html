@if (status() !== 'ready' || displayMode() === 'file') {
  <section class="pdf-status">
    <h1>{{ title() }}</h1>
    <p>{{ subtitle() }}</p>

    @if (status() === 'loading') {
      <div aria-hidden="true" class="spinner-border" role="status"></div>
    }

    @if (status() === 'error') {
      <small>{{ errorMessage() }}</small>
    }
  </section>
}

@if (displayMode() === 'blob' && pdfUrl(); as previewUrl) {
  <iframe [src]="previewUrl" class="pdf-preview" title="PDF preview"></iframe>
}
