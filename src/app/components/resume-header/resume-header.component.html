@if (isReady()) {
  <header class="resume-header">
    <div class="backdrop"></div>
    <div class="backdrop-edge"></div>

    <nav class="header-nav navbar navbar-expand navbar-background">
      <div class="container">
        <a [routerLink]="'/'" class="navbar-brand mb-0 h1 me-auto d-none d-sm-inline-block">
          resume.szram.co
        </a>
        <ul class="navbar-nav align-items-center">
          @if (links().length) {
            @for (link of links(); track link.key) {
              <li class="nav-item mx-1 link-scale">
                <a
                  [href]="link.value"
                  [title]="link.name"
                  class="btn btn-link nav-link"
                  target="_blank"
                >
                  <span [ngClass]="['bi', 'bi-' + link.key]"></span>
                </a>
              </li>
            }
            <li class="nav-item mx-1 link-scale">
              <a
                [href]="'/' + getCurrentLanguage() + '/pdf'"
                [title]="'DOWNLOAD' | translate"
                class="btn btn-link nav-link"
                target="_blank"
              >
                <span class="bi bi-download"></span>
              </a>
            </li>
          }
          <li class="nav-item d-none d-sm-block">
            <div class="resume-vr"></div>
          </li>
          <li class="nav-item link-scale ms-auto ms-sm-0">
            <button
              (click)="themeToggle()"
              [attr.aria-label]="'BUTTON.TOGGLE_THEME' | translate"
              class="btn btn-link nav-link text-decoration-none btn-lang"
            >
              @if (isThemeLight) {
                <i class="bi bi-moon-stars-fill"></i>
              }
              @if (isThemeDark) {
                <i class="bi bi-sun-fill"></i>
              }
            </button>
          </li>
          <li class="nav-item link-scale">
            @if (getCurrentLanguage() !== 'en') {
              <button
                [attr.aria-label]="'BUTTON.CHANGE_LANGUAGE_EN' | translate"
                [routerLink]="['/', 'en']"
                class="btn btn-link nav-link text-decoration-none btn-lang"
                role="button"
              >
                EN
              </button>
            }
            @if (getCurrentLanguage() !== 'pl') {
              <button
                [attr.aria-label]="'BUTTON.CHANGE_LANGUAGE_PL' | translate"
                [routerLink]="['/', 'pl']"
                class="btn btn-link nav-link text-decoration-none btn-lang"
                role="button"
              >
                PL
              </button>
            }
          </li>
        </ul>
      </div>
    </nav>
  </header>
}
